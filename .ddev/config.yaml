name: editorial-flow
type: typo3
docroot: .Build/Web
php_version: "8.4"
webserver_type: nginx-fpm
xdebug_enabled: false
database:
  type: mariadb
  version: "10.11"
composer_version: "2"
nodejs_version: "22"
use_dns_when_possible: true

# Surface hook failures instead of swallowing them. Without this a failed
# composer install leaves a half-built instance and `ddev start` still reports
# success - which is exactly how "setup does not work" looks from the outside.
fail_on_hook_fail: true

# `typo3 setup` reads these; passing them as env is more robust than a long
# flag list, and it is how the TYPO3 core "tryout" scaffold does it.
web_environment:
  - TYPO3_CONTEXT=Development
  - TYPO3_DB_DRIVER=mysqli
  - TYPO3_DB_HOST=db
  - TYPO3_DB_PORT=3306
  - TYPO3_DB_DBNAME=db
  - TYPO3_DB_USERNAME=db
  - TYPO3_DB_PASSWORD=db
  - TYPO3_SETUP_ADMIN_USERNAME=admin
  - TYPO3_SETUP_ADMIN_PASSWORD=Password.1
  - TYPO3_SETUP_ADMIN_EMAIL=admin@example.com
  - TYPO3_PROJECT_NAME=Editorial Flow
  # Imports theme-camino/Initialisation/data.xml - a full demo site (Camino,
  # FAQs, Packing List, Route Comparison, images). The distribution creates the
  # site configuration itself, which is why TYPO3_SETUP_CREATE_SITE must NOT be
  # set: SetupCommand throws if both are given. Needs typo3/cms-impexp.
  - TYPO3_SETUP_DISTRIBUTION=theme_camino
  # Functional tests: the testing framework creates and drops its own databases
  # per test run, which the unprivileged `db` user may not do - hence root here.
  - typo3DatabaseDriver=mysqli
  - typo3DatabaseHost=db
  - typo3DatabaseName=db
  - typo3DatabaseUsername=root
  - typo3DatabasePassword=root

hooks:
  post-start:
    - exec: bash /var/www/html/.ddev/scripts/post-start.sh
