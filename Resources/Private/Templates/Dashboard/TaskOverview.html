<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="widget-content">
    <div class="contentflow-widget-stats" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px;">
        <div class="stat-card" style="background: var(--typo3-surface-container, #f3f4f6); padding: 12px; border-radius: 6px; text-align: center;">
            <div style="font-size: 24px; font-weight: 700; color: var(--typo3-color-primary, #0078d4);">{stats.total_open}</div>
            <div style="font-size: 11px; text-transform: uppercase; opacity: 0.8;">Open Tasks</div>
        </div>
        <div class="stat-card" style="background: var(--typo3-surface-container, #f3f4f6); padding: 12px; border-radius: 6px; text-align: center;">
            <div style="font-size: 24px; font-weight: 700; color: var(--typo3-state-success-text, #107c41);">{stats.done}</div>
            <div style="font-size: 11px; text-transform: uppercase; opacity: 0.8;">Completed</div>
        </div>
    </div>
    <div class="stat-breakdown" style="padding: 0 12px 12px; font-size: 12px;">
        <div style="display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #eee;">
            <span>Backlog</span><strong>{stats.backlog}</strong>
        </div>
        <div style="display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #eee;">
            <span>Planned</span><strong>{stats.planned}</strong>
        </div>
        <div style="display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #eee;">
            <span>In Progress</span><strong>{stats.in_progress}</strong>
        </div>
        <div style="display: flex; justify-content: space-between; padding: 4px 0;">
            <span>Review</span><strong>{stats.review}</strong>
        </div>
    </div>
</div>
</html>
