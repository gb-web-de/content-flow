<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="widget-content" style="padding: 8px 12px;">
    <f:if condition="{activities -> f:count()} > 0">
        <f:then>
            <ul style="list-style: none; margin: 0; padding: 0; font-size: 12px; display: flex; flex-direction: column; gap: 6px;">
                <f:for each="{activities}" as="activity">
                    <li style="border-bottom: 1px solid #eee; padding-bottom: 4px;">
                        <strong>{activity.event}</strong> on <em>{activity.task_title}</em>
                    </li>
                </f:for>
            </ul>
        </f:then>
        <f:else>
            <div style="font-size: 12px; opacity: 0.7; padding: 12px 0;">No recent activities logged.</div>
        </f:else>
    </f:if>
</div>
</html>
