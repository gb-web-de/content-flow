services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  GbWeb\ContentFlow\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  # Listed explicitly so constructor changes in these entry-point classes are
  # reflected in TYPO3's compiled container as soon as Services.yaml changes.
  GbWeb\ContentFlow\Controller\ContentFlowController:
    public: true

  GbWeb\ContentFlow\Controller\TaskAjaxController:
    public: true

  GbWeb\ContentFlow\EventListener\PageModuleEventListener:
    public: true

  GbWeb\ContentFlow\Hooks\TaskAutoCreationDataHandlerHook:
    public: true

  GbWeb\ContentFlow\Dashboard\Widget\TaskOverviewWidget:
    tags:
      - name: dashboard.widget
        identifier: contentFlowTaskOverview
        groupNames: 'general'
        title: 'Content Flow: Task overview'
        description: 'How much work sits in each state, and what nobody has taken yet'
        iconIdentifier: apps-pagetree-page-default
        height: 'medium'
        width: 'medium'

  GbWeb\ContentFlow\Dashboard\Widget\MyTasksWidget:
    tags:
      - name: dashboard.widget
        identifier: contentFlowMyTasks
        groupNames: 'general'
        title: 'Content Flow: My tasks'
        description: 'Tasks assigned to you'
        iconIdentifier: status-user-backend
        height: 'medium'
        width: 'medium'

  GbWeb\ContentFlow\Dashboard\Widget\RecentActivityWidget:
    tags:
      - name: dashboard.widget
        identifier: contentFlowRecentActivity
        groupNames: 'general'
        title: 'Content Flow: Recent activity'
        description: 'Latest editorial decisions across the board'
        iconIdentifier: actions-document-history
        height: 'medium'
        width: 'medium'

  # The one widget xima/xima-typo3-content-planner has that the three above did
  # not cover - a feed to catch up on discussion. See RecentCommentsWidget's
  # docblock for why the other two xima widgets were not copied.
  GbWeb\ContentFlow\Dashboard\Widget\RecentCommentsWidget:
    tags:
      - name: dashboard.widget
        identifier: contentFlowRecentComments
        groupNames: 'general'
        title: 'Content Flow: Recent comments'
        description: 'Catch up on discussion across the board'
        iconIdentifier: actions-message
        height: 'medium'
        width: 'medium'
